# Tests du conseiller et contrôles du code, à chaque envoi sur main et sur chaque demande de fusion (Dependabot)
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dev/tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      # fichiers générés à jour : reconstruits depuis conseiller.js à sa propre version, ils doivent être identiques à ceux du dépôt
      - name: Fichiers générés à jour
        working-directory: .
        run: |
          v=$(sed -n "s/.*const VERSION = '\([0-9.]*\)'.*/\1/p" conseiller.js)
          python3 dev/outils/build.py "$v"
          git diff --exit-code
  controles:
    # workflows (actionlint : erreurs ; zizmor : failles propres à GitHub Actions) et scripts Python (ruff : erreurs et bogues probables)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: pipx run --spec actionlint-py==1.7.12.25 actionlint .github/workflows/*.yml
      - name: zizmor
        run: pipx run zizmor==1.32.0 --offline .github/workflows/
      - name: ruff
        run: pipx run ruff==0.17.3 check dev/
      - name: tests de la veille
        run: python3 dev/veille/test_veille.py
  prod:
    # Livraison (22/11/2026) : les clients à jour automatique tirent la branche prod,
    # avancée ici seulement quand tests et contrôles sont verts sur un envoi à main. Jamais en arrière :
    # prod n'avance que si le commit testé la contient (comparaison « ahead ») ; un passage plus ancien qui
    # finit après un plus récent ne fait rien. Revenir : tirer main.
    needs: [tests, controles]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write          # déplacer la référence prod (API git refs), rien d'autre
    steps:
      - name: Avancer prod
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          etat=$(gh api "repos/$REPO/compare/prod...$SHA" --jq .status)
          echo "prod...$SHA : $etat"
          case "$etat" in
            ahead) gh api -X PATCH "repos/$REPO/git/refs/heads/prod" -f sha="$SHA" -F force=false --jq .object.sha ;;
            identical|behind) echo "rien à faire" ;;
            *) echo "::error::prod et main ont divergé ($etat) : à remettre d'aplomb à la main"; exit 1 ;;
          esac
