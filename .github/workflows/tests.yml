# Tests du conseiller et contrôles du code, à chaque envoi sur main et sur chaque demande de fusion (Dependabot)
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dev/tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
  controles:
    # workflows (actionlint : erreurs ; zizmor : failles propres à GitHub Actions) et scripts Python (ruff : erreurs et bogues probables)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: pipx run --spec actionlint-py==1.7.12.25 actionlint .github/workflows/*.yml
      - name: zizmor
        run: pipx run zizmor==1.32.0 --offline .github/workflows/
      - name: ruff
        run: pipx run ruff==0.17.3 check dev/
