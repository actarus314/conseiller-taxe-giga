# Veille : vérifie que le barème et les règles du jeu sont ceux du conseiller.
# Écart ou page inaccessible → une issue (une seule par constat) ; retour à la normale → issues de veille refermées.
# Cadence : la veille se relance elle-même après le délai de l'environnement « attente-veille » (réglé dans
# Settings → Environments), la planification de GitHub n'étant pas fiable ; le passage horaire sert de secours
# pour relancer la chaîne si elle casse.
name: Veille du jeu
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['dev/veille/**', '.github/workflows/veille.yml', 'conseiller.js']
permissions:
  contents: read
  issues: write
jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contrôles l'un après l'autre, jamais annulés ; un lancement manuel passe tout de suite, même pendant l'attente
    concurrency:
      group: veille-controle
      cancel-in-progress: false
    outputs:
      debut: ${{ steps.debut.outputs.t }}
    steps:
      - id: debut
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
      - name: Comparer le jeu et le conseiller
        id: v
        run: |
          # page inaccessible : 3 essais espacés de 2 min avant de conclure
          for essai in 1 2 3; do
            : > "$GITHUB_OUTPUT.tmp"
            GITHUB_OUTPUT="$GITHUB_OUTPUT.tmp" python3 dev/veille/veille.py > rapport.md && code=0 || code=$?
            if [ "$code" != 2 ]; then break; fi
            if [ "$essai" != 3 ]; then sleep 120; fi
          done
          cat "$GITHUB_OUTPUT.tmp" >> "$GITHUB_OUTPUT"
          cat rapport.md | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Ouvrir ou refermer les issues de veille
        env:
          GH_TOKEN: ${{ github.token }}
          ETAT: ${{ steps.v.outputs.etat }}
          EMP: ${{ steps.v.outputs.empreinte }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create veille --color FFD23F --description "Alerte de la veille automatique du jeu" --force >/dev/null
          if [ "$ETAT" = conforme ]; then
            for n in $(gh issue list --label veille --state open --json number --jq '.[].number'); do
              gh issue close "$n" --comment "Conforme de nouveau ($RUN)."
            done
            exit 0
          fi
          if gh issue list --label veille --state open --json title --jq '.[].title' | grep -qF "[$EMP]"; then
            echo "Issue déjà ouverte pour ce constat [$EMP]."; exit 0
          fi
          if [ "$ETAT" = ecart ]; then titre="Veille : le jeu ne correspond plus au conseiller [$EMP]"; else titre="Veille : page du jeu inaccessible [$EMP]"; fi
          { cat rapport.md; echo; echo "Exécution : $RUN"; } > corps.md
          gh issue create --title "$titre" --label veille --body-file corps.md
  relance:
    # attend le délai de l'environnement, puis relance la veille ; sans délai effectif, ne relance pas (pas de boucle)
    needs: veille
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # une seule relance en attente : la plus récente remplace l'ancienne, donc une seule chaîne
    concurrency:
      group: veille-relance
      cancel-in-progress: true
    environment:
      name: attente-veille
      deployment: false
    permissions:
      actions: write
    steps:
      - name: Relancer la veille
        env:
          GH_TOKEN: ${{ github.token }}
          DEBUT: ${{ needs.veille.outputs.debut }}
        run: |
          ecart=$(( $(date +%s) - ${DEBUT:-0} ))
          echo "Écart depuis le début de la veille : ${ecart} s"
          if [ "$ecart" -lt 100 ]; then
            echo "::warning::Délai de l'environnement attente-veille absent ou trop court (${ecart} s) : pas de relance, pour ne pas boucler."
            exit 0
          fi
          gh workflow run veille.yml --ref main -R "$GITHUB_REPOSITORY"
