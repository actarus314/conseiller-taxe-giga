# Veille : vérifie que le barème et les règles du jeu sont ceux du conseiller.
# Écart → une issue (une seule par constat) ; retour à la normale → issues de veille refermées.
# Page inaccessible (le site bloque parfois les robots quand son trafic monte) : un seul essai, puis la relance suivante est
# sautée (passage sans requête au site) ; l'issue n'est ouverte qu'au deuxième échec de suite. L'état passe d'un passage
# au suivant par les entrées du lancement (sauter, echecs).
# Cadence : la veille se relance elle-même après le délai de l'environnement « attente-veille » (réglé dans
# Settings → Environments), la planification de GitHub n'étant pas fiable ; le passage horaire sert de secours
# pour relancer la chaîne si elle casse.
name: Veille du jeu
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      sauter:
        description: Passage sans requête au site (après un échec)
        type: boolean
        default: false
      echecs:
        description: Échecs d'accès de suite avant ce passage
        type: string
        default: '0'
  push:
    branches: [main]
    paths: ['dev/veille/**', '.github/workflows/veille.yml', 'conseiller.js']
permissions:
  contents: read
jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    # contrôles l'un après l'autre : celui en cours n'est jamais annulé, un contrôle en attente est remplacé par le suivant
    # (son relais de relance s'arrête faute d'heure de fin, celui du suivant prend la suite) ; un lancement manuel passe
    # tout de suite, même pendant l'attente de la relance
    concurrency:
      group: veille-controle
      cancel-in-progress: false
    outputs:
      fin: ${{ steps.fin.outputs.t }}
      etat: ${{ steps.v.outputs.etat }}
      echecs: ${{ steps.v.outputs.echecs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Comparer le jeu et le conseiller
        id: v
        env:
          SAUTER: ${{ inputs.sauter }}
          AVANT: ${{ inputs.echecs }}
        run: |
          case "$AVANT" in ''|*[!0-9]*) AVANT=0 ;; esac
          AVANT=$((10#$AVANT))
          if [ "$SAUTER" = true ]; then
            echo "Passage sauté après un échec d'accès : aucune requête au site." >> "$GITHUB_STEP_SUMMARY"
            { echo "etat=saute"; echo "echecs=$AVANT"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          # un seul essai : après un échec, c'est la relance suivante qui est sautée
          python3 dev/veille/veille.py > rapport.md || true
          etat=$(grep -o '^etat=.*' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          if [ "$etat" = inaccessible ]; then echo "echecs=$((AVANT + 1))" >> "$GITHUB_OUTPUT"; else echo "echecs=0" >> "$GITHUB_OUTPUT"; fi
          # rapport (contenu tiers) dans le résumé seulement, jamais sur la sortie standard : pas de commandes « :: » injectables
          cat rapport.md >> "$GITHUB_STEP_SUMMARY"
      - name: Ouvrir ou refermer les issues de veille
        if: steps.v.outputs.etat != 'saute'
        env:
          GH_TOKEN: ${{ github.token }}
          ETAT: ${{ steps.v.outputs.etat }}
          EMP: ${{ steps.v.outputs.empreinte }}
          ECHECS: ${{ steps.v.outputs.echecs }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create veille --color FFD23F --description "Alerte de la veille automatique du jeu" --force >/dev/null
          if [ "$ETAT" = conforme ]; then
            for n in $(gh issue list --label veille --state open --json number --jq '.[].number'); do
              gh issue close "$n" --comment "Conforme de nouveau ($RUN)."
            done
            exit 0
          fi
          if [ "$ETAT" = inaccessible ] && [ "${ECHECS:-0}" -lt 2 ]; then
            echo "Premier échec d'accès : pas d'issue, la relance suivante est sautée."; exit 0
          fi
          if gh issue list --label veille --state open --json title --jq '.[].title' | grep -qF "[$EMP]"; then
            echo "Issue déjà ouverte pour ce constat [$EMP]."; exit 0
          fi
          case "$ETAT" in
            ecart) titre="Veille : le jeu ne correspond plus au conseiller [$EMP]" ;;
            erreur) titre="Veille : erreur d'analyse de la page du jeu [$EMP]" ;;
            *) titre="Veille : page du jeu inaccessible [$EMP]" ;;
          esac
          { cat rapport.md; echo; echo "Exécution : $RUN"; } > corps.md
          gh issue create --title "$titre" --label veille --body-file corps.md
      - name: Noter l'heure de fin
        id: fin
        if: always()
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
  relance:
    # attend le délai de l'environnement, puis relance la veille ; sans délai effectif, ne relance pas (pas de boucle)
    needs: veille
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # une seule relance en attente : la plus récente remplace l'ancienne, donc une seule chaîne
    concurrency:
      group: veille-relance
      cancel-in-progress: true
    environment:
      name: attente-veille
      deployment: false
    permissions:
      actions: write
    steps:
      - name: Relancer la veille
        env:
          GH_TOKEN: ${{ github.token }}
          FIN: ${{ needs.veille.outputs.fin }}
          ETAT: ${{ needs.veille.outputs.etat }}
          ECHECS: ${{ needs.veille.outputs.echecs }}
        run: |
          # garde-fous contre une boucle : heure de fin connue, délai réel depuis la fin du contrôle, 6 passages par heure au plus (délai de 15 min, plus les passages lancés par un envoi)
          if [ -z "$FIN" ]; then echo "::warning::Heure de fin de la veille inconnue : pas de relance."; exit 0; fi
          ecart=$(( $(date +%s) - FIN ))
          echo "Écart depuis la fin de la veille : ${ecart} s"
          if [ "$ecart" -lt 100 ]; then
            echo "::warning::Délai de l'environnement attente-veille absent ou trop court (${ecart} s) : pas de relance, pour ne pas boucler."
            exit 0
          fi
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow veille.yml --created ">$(date -u -d '-60 min' +%FT%TZ)" --json databaseId --jq length)
          if [ "$n" -gt 6 ]; then echo "::warning::$n passages en une heure : pas de relance."; exit 0; fi
          # erreur passagère de GitHub (HTTP 500 le 04/11/2026 à 09:43 UTC) : 4 essais, 30 s d'écart
          # après un échec d'accès, le passage suivant est sauté (aucune requête au site) : prochain essai réel deux délais plus tard
          sauter=false; if [ "$ETAT" = inaccessible ]; then sauter=true; fi
          case "$ECHECS" in ''|*[!0-9]*) ECHECS=0 ;; esac
          for essai in 1 2 3 4; do
            if gh workflow run veille.yml --ref main -R "$GITHUB_REPOSITORY" -f sauter="$sauter" -f echecs="$ECHECS"; then exit 0; fi
            echo "::warning::Relance refusée par GitHub (essai $essai sur 4)"
            if [ "$essai" -lt 4 ]; then sleep 30; fi
          done
          exit 1
